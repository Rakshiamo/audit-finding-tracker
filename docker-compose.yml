services:
  postgres:
    image: postgres:15-alpine
    container_name: audit-tracker-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - audit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: audit-tracker-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - audit-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      # CHANGED: '.' looks in the root folder where your Dockerfile & pom.xml are
      context: .
      dockerfile: Dockerfile
    container_name: audit-tracker-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8081
      SECURITY_JWT_SECRET: ${JWT_SECRET}
      APP_TIMEZONE: ${APP_TIMEZONE}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - audit-network

  ai-service:
    build:
      # CHANGED: This looks into the 'ai-service' folder you created
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: audit-tracker-ai-service
    environment:
      AI_SERVICE_PORT: ${AI_SERVICE_PORT}
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "${AI_SERVICE_PORT}:${AI_SERVICE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${AI_SERVICE_PORT}/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - audit-network

  frontend:
    image: nginx:alpine
    container_name: audit-tracker-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - audit-network

volumes:
  postgres_data:
  redis_data:

networks:
  audit-network:
    driver: bridge
